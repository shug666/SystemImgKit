# Build a frozen, portable SystemImgKit package for Ubuntu 20.04.6 (x86_64).
#
# Why a container: GitHub-hosted ubuntu-20.04 runners were retired in 2025.
# We build inside `container: ubuntu:20.04` on an ubuntu-latest job so the
# frozen artifacts are linked against glibc 2.31 and therefore run on 20.04.6.
# Building directly on ubuntu-latest (glibc 2.39) would produce binaries that
# fail on 20.04 with "GLIBC_2.34 not found".
#
# Triggers: tags matching v* publish to a GitHub Release; workflow_dispatch
# builds and uploads artifacts for iteration (no release needed).

name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed by softprops/action-gh-release to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
        # Avoid tzdata interactive prompt during apt install.
        TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build & runtime host deps (mirror install-deps.sh)
        run: |
          apt-get update -qq
          # deadsnakes PPA needs add-apt-repository (software-properties-common)
          apt-get install -y --no-install-recommends \
            ca-certificates software-properties-common gnupg curl \
            e2fsprogs rsync \
            android-sdk-libsparse-utils android-sdk-ext4-utils \
            adb fastboot \
            policykit-1 \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update -qq
          # deadsnakes focal has no python3.12-venv package; bootstrap pip via
          # ensurepip instead of relying on a venv.
          apt-get install -y --no-install-recommends python3.12
          python3.12 -m ensurepip --upgrade

      - name: Verify toolchain
        run: |
          python3.12 --version
          python3.12 -m pip --version
          for t in mke2fs e2fsck debugfs rsync pkexec; do
            command -v "$t" || { echo "missing $t"; exit 1; }
          done

      - name: Install Python deps
        run: |
          python3.12 -m pip install --upgrade pip
          python3.12 -m pip install \
            "PySide6>=6.6" "PyYAML>=6.0" "pyinstaller" "setuptools>=68" "wheel"
          # Install the project so entry points / package import resolve.
          python3.12 -m pip install -e .

      - name: Build with PyInstaller (onedir, two entries)
        run: |
          python3.12 -m PyInstaller packaging/systemimgkit.spec --noconfirm
          # Sanity: both sibling executables must sit at the onedir root.
          test -x dist/systemimgkit/systemimgkit
          test -x dist/systemimgkit/root_helper
          ls -l dist/systemimgkit/

      - name: Package tarball
        id: pkg
        run: |
          # Tag run → name with tag; dispatch run → name with short SHA.
          if [ -n "${GITHUB_REF_NAME:-}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-8)"
          fi
          ARCHIVE="SystemImgKit-${VERSION}-ubuntu-20.04-x86_64.tar.gz"
          # Bundle install-deps.sh alongside the onedir for one self-contained archive.
          cp install-deps.sh dist/systemimgkit/
          tar -czf "${ARCHIVE}" -C dist systemimgkit
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "${ARCHIVE}"

      - name: Upload workflow artifact (always, for iteration)
        uses: actions/upload-artifact@v4
        with:
          name: SystemImgKit-ubuntu-20.04-x86_64
          path: |
            ${{ steps.pkg.outputs.archive }}
            install-deps.sh
          retention-days: 14

      - name: Create GitHub Release & upload assets (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.archive }}
            install-deps.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
